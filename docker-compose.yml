services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pir-sqlserver
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
      MSSQL_PID: "Developer"
    volumes:
      - sqlserver_data:/var/opt/mssql

  redis:
    image: redis:7-alpine
    container_name: pir-redis
    ports:
      - "6379:6379"

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: pir-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

volumes:
  sqlserver_data:
  minio_data:
